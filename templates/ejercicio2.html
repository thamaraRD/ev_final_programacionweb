{% extends "base.html" %}

{% block titulo %}Inicio de sesión{% endblock %}

{% block contenido %}
<main class="panel">
    <h1>Inicio de sesión</h1>
    <form method="post">
        <label for="nombre">Ingresa tu nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="username" value="{{ nombre }}" required>

        <label for="contrasena">Ingresa tu contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>

        <button type="submit">Verificar</button>
    </form>
    {% if mensaje %}
        <p class="resultado">{{ mensaje }}</p>
    {% endif %}
</main>
{% endblock %}
